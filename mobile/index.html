<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>NexGene</title><link rel="stylesheet" href="/mobile/styles.css"></head><body><main>
<section id="auth" class="screen"><div class="card"><h1>NexGene</h1><p class="muted">Daily check-in prototype</p><div class="tabs"><button id="tab-login" class="active">Login</button><button id="tab-register">Register</button></div><form id="auth-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit" id="auth-submit">Continue</button></form><p id="auth-error" class="error" hidden></p></div></section>
<section id="home" class="screen" hidden><header><div><h1>Today</h1><p class="muted" id="who"></p></div><button id="logout" class="ghost">Log out</button></header><div class="grid"><button class="card action" data-open="morning">Morning check-in</button><button class="card action" data-open="evening">Evening check-in</button><button class="card action" data-open="timeline">Timeline</button><button class="card action" data-open="insights">Insights</button></div></section>
<section id="morning" class="screen" hidden><header><button class="back" data-back>←</button><h1>Morning</h1></header><form id="morning-form" class="card form"><label>Sleep duration (hours)<input name="sleep_duration" type="number" step="0.1" min="0" max="24" required></label><label>Sleep quality (1-10)<input name="sleep_quality" type="number" min="1" max="10" required></label><label>Energy (1-10)<input name="energy" type="number" min="1" max="10" required></label><button type="submit">Save morning</button></form></section>
<section id="evening" class="screen" hidden><header><button class="back" data-back>←</button><h1>Evening</h1></header><form id="evening-form" class="card form"><label>Mood (1-10)<input name="mood" type="number" min="1" max="10" required></label><label>Stress (1-10)<input name="stress" type="number" min="1" max="10" required></label><label>Focus (1-10)<input name="focus" type="number" min="1" max="10" required></label><label>Activity duration (minutes, optional)<input name="activity_duration" type="number" step="1" min="0" max="1440"></label><button type="submit">Save evening</button></form></section>
<section id="timeline" class="screen" hidden><header><button class="back" data-back>←</button><h1>Timeline</h1></header><div id="timeline-list" class="list"></div></section>
<section id="insights" class="screen" hidden><header><button class="back" data-back>←</button><h1>Insights</h1></header><div id="insights-list" class="list"></div></section>
</main><script src="/mobile/app.js"></script></body></html>
