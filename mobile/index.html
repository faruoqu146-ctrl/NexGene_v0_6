<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>NexGene</title><link rel="stylesheet" href="/mobile/styles.css"></head><body><main>
<section id="auth" class="screen"><div class="card"><h1>NexGene</h1><p class="lede">Daily check-ins for sleep, energy, mood and focus.</p><div class="tabs"><button id="tab-login" class="active">Log in</button><button id="tab-register">Register</button></div><form id="auth-form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit" id="auth-submit">Continue</button><p id="auth-error" class="error" hidden></p></form></div></section>
<section id="home" class="screen" hidden><header><div><h1>Today</h1><p id="user-email" class="muted"></p></div><button id="logout" class="ghost">Log out</button></header><div class="grid"><div class="card"><h2>Morning</h2><form id="morning-form"><label>Sleep hours<input id="sleep_duration" type="number" step="0.1" min="0" max="24" required></label><label>Sleep quality (1-10)<input id="sleep_quality" type="number" min="1" max="10" required></label><label>Energy (1-10)<input id="energy" type="number" min="1" max="10" required></label><button type="submit">Save morning</button></form></div><div class="card"><h2>Evening</h2><form id="evening-form"><label>Mood (1-10)<input id="mood" type="number" min="1" max="10" required></label><label>Stress (1-10)<input id="stress" type="number" min="1" max="10" required></label><label>Focus (1-10)<input id="focus" type="number" min="1" max="10" required></label><label>Activity minutes<input id="activity_duration" type="number" min="0" max="1440" step="1"></label><button type="submit">Save evening</button></form></div></div><div class="card"><h2>Insights</h2><div id="insights" class="list muted">No insights yet.</div></div><div class="card"><h2>Timeline</h2><div id="timeline" class="list muted">No entries yet.</div></div></section>
</main><script src="/mobile/app.js"></script></body></html>
