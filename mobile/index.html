<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>NexGene</title><link rel="stylesheet" href="/mobile/styles.css"></head><body><main>
<section id="auth" class="screen"><div class="mark">N</div><p class="eyebrow">NEXGENE</p><h1>Know your patterns.<br>Understand your health.</h1><p class="lede">Daily check-ins for sleep, energy, mood and focus.</p><div class="tabs"><button type="button" id="loginTab" class="active">Log in</button><button type="button" id="registerTab">Register</button></div><form id="authForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Log in</button><p id="authError" class="error"></p></form></section>
<section id="home" class="screen hidden"><header><div><p class="eyebrow">Today</p><h1 id="greeting">Hello</h1><p id="userEmail" class="muted"></p></div><button type="button" id="logout" class="ghost">Log out</button></header><div class="actions"><button type="button" id="morningBtn" class="primary">Morning check-in</button><button type="button" id="eveningBtn" class="primary">Evening check-in</button></div><section class="card"><h2>Insights</h2><div id="insights" class="list"></div></section><section class="card"><h2>Timeline</h2><div id="timeline" class="list"></div></section></section>
<dialog id="dlg"><form id="checkin" method="dialog"><h2 id="dlgTitle">Check-in</h2><div id="fields"></div><p id="checkinError" class="error"></p><menu><button type="button" id="cancel" value="cancel">Cancel</button><button type="submit" value="default">Save</button></menu></form></dialog>
</main><script src="/mobile/app.js"></script></body></html>
